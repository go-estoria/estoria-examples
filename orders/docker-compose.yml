services:
  postgres:
    image: postgres:17-alpine
    container_name: estoria-orders-db
    environment:
      POSTGRES_USER: estoria
      POSTGRES_PASSWORD: estoria
      POSTGRES_DB: estoria
    ports:
      # host port 5433 so this example can run alongside the sibling
      # postgres example (which uses the default 5432)
      - "5433:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoria -d estoria"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  orders_data:
