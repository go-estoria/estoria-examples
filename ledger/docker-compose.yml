services:
  postgres:
    image: postgres:17-alpine
    container_name: estoria-ledger-db
    environment:
      POSTGRES_USER: estoria
      POSTGRES_PASSWORD: estoria
      POSTGRES_DB: estoria
    ports:
      # host port 5434 so this example can run alongside the sibling postgres
      # (5432) and orders (5433) examples
      - "5434:5432"
    volumes:
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoria -d estoria"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  ledger_data:
